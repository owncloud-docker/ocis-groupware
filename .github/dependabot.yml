version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: sunday
      time: '22:00'
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # The commit check requires a conventional type, which Dependabot does
    # not write by default, and the release notes skip chore commits.
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
      day: sunday
      time: '22:00'
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # The commit check requires a conventional type, which Dependabot does
    # not write by default, and the release notes skip chore commits.
    commit-message:
      prefix: chore
      include: scope
    # The ownCloud Web packages follow the Web version that oCIS ships, so
    # their updates are made by hand together with the supported versions.
    ignore:
      - dependency-name: "@ownclouders/*"
      # Their peer ranges (eslint ^9, vite up to 7) have to move first, so
      # these majors do not install until the Web packages are updated.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      # TypeScript 7 does not load in vue-tsc or typescript-eslint yet (the
      # latter supports up to 6.0), so type checking and linting fail with it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # FullCalendar 7 replaces the separate daygrid, timegrid, interaction
      # and luxon packages (still at 6.1.22) with subpaths of
      # @fullcalendar/vue3 and uses Temporal and a new theme. The calendar
      # moves to it in one dedicated change, not by version bumps.
      - dependency-name: "@fullcalendar/*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: sunday
      time: '22:00'
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # The commit check requires a conventional type, which Dependabot does
    # not write by default, and the release notes skip chore commits.
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: sunday
      time: '22:00'
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # The commit check requires a conventional type, which Dependabot does
    # not write by default, and the release notes skip chore commits.
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
