name: Validate PR title

# The squash-merge commit uses the PR title and the release notes are generated
# from it (see cliff.toml), so the title must be a conventional commit.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-pr-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Lowercase description, as in the Conventional Commits examples.
          # Dependabot writes "Bump x from a to b" after the configured
          # prefix and cannot be told to lowercase it, so for its own PRs
          # only the type is enforced. The author of the PR is checked, not
          # the actor, so a human pushing to a Dependabot branch changes
          # nothing and a human PR cannot use the exemption.
          subjectPattern: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && '^.+$' || '^(?![A-Z]).+$' }}
          subjectPatternError: 'The description "{subject}" must start with a lowercase letter.'
