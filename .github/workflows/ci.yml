name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  test:
    runs-on: ubuntu-latest
    # The classic database reader is tested against real databases loaded
    # from the dumps in test/classic.
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: classic
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: classic
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      CLASSIC_REQUIRE_DB: "1"
      CLASSIC_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/classic
      CLASSIC_TEST_POSTGRES_URL: postgres://postgres:pg@127.0.0.1:5432/classic?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -race -cover

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      # Lint, types, translation check, tests and build, the same as locally.
      - run: npm run check

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.5.0 ./...

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t ocis-groupware:ci .

  # Lints the Helm chart, renders it with every option on and validates the
  # manifests, then installs it into a kind cluster with the image built from
  # this commit. oCIS is not part of the cluster: the install checks that the
  # pod starts on its volume and passes its probe.
  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0
      - name: Lint the chart
        run: |
          helm lint deploy/helm/ocis-groupware -f deploy/helm/ocis-groupware/ci/default-values.yaml
          helm lint deploy/helm/ocis-groupware -f deploy/helm/ocis-groupware/test/full-values.yaml
      - name: Validate the rendered manifests
        run: |
          for values in ci/default-values.yaml test/full-values.yaml; do
            helm template check deploy/helm/ocis-groupware --kube-version 1.31.0 \
              -f "deploy/helm/ocis-groupware/$values" |
              go run github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0 \
                -strict -summary -kubernetes-version 1.31.0
          done
      - uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: chart
      - name: Build the image and load it into the cluster
        run: |
          docker build -t ocis-groupware:ci .
          kind load docker-image ocis-groupware:ci --name chart
      - name: Install the chart
        run: |
          ct install --charts deploy/helm/ocis-groupware \
            --helm-extra-set-args "--set=image.repository=ocis-groupware --set=image.tag=ci --set=image.pullPolicy=Never"

  # Boots oCIS and the service three times: with the ingress routing the
  # groupware paths (docker-compose.yml as it is), with the classic DAV paths
  # on top of that (deploy/compose/compat-paths.yml), and with the oCIS proxy
  # forwarding them (deploy/compose/ocis-proxy.yml on top). The tests know
  # which route they are on through STACK_ROUTE and STACK_COMPAT. The classic
  # paths entry also migrates the classic fixture into the running stack.
  stack:
    name: stack (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ingress
            route: ingress
            compat: "false"
            compose_file: docker-compose.yml
          - name: ingress-compat
            route: ingress
            compat: "true"
            compose_file: docker-compose.yml:deploy/compose/compat-paths.yml
          - name: ocis-proxy
            route: ocis-proxy
            compat: "false"
            compose_file: docker-compose.yml:deploy/compose/ocis-proxy.yml
    env:
      OCIS_VERSION: 8.2.2
      COMPOSE_FILE: ${{ matrix.compose_file }}
      STACK_ROUTE: ${{ matrix.route }}
      STACK_COMPAT: ${{ matrix.compat }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Resolve the stack's domain
        run: echo "127.0.0.1 ocis.localhost" | sudo tee -a /etc/hosts
      - name: Install the browser test
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      # The Python check needs REPORT, which the oCIS proxy route lacks.
      - name: Install the Python client that ships with groupkit
        if: matrix.route == 'ingress'
        run: |
          go mod download github.com/LukasHirt/groupkit
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --require-hashes \
            -r "$(go list -m -f '{{.Dir}}' github.com/LukasHirt/groupkit)/test/pyclient/requirements.txt"
      - name: Start the stack
        run: docker compose up --build --detach --quiet-pull
      - name: Export the stack's certificate
        run: docker compose cp traefik:/certs/cert.pem "$RUNNER_TEMP/cert.pem"
      # The tests wait for the service and the identity provider themselves.
      - name: Run the stack tests
        env:
          STACK_CA_FILE: ${{ runner.temp }}/cert.pem
          STACK_PYTHON: ${{ runner.temp }}/venv/bin/python
          STACK_WAIT: 5m
        run: go test -tags stack -count=1 -v ./test/stack/
      - name: Open the web application inside oCIS Web
        working-directory: web
        env:
          STACK_URL: https://ocis.localhost
        run: npm run test:e2e
      # The screen test saves a picture of every screen in light, dark and
      # phone sizes. They are for a person to look at, so they are kept
      # whether the run passed or not.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screens-${{ matrix.name }}
          path: web/test-results/screens/
          if-no-files-found: ignore
          retention-days: 7
      # Changes the stack's data and restarts the service, so it runs last.
      # Needs the classic paths, which only this entry of the matrix has.
      - name: Migrate the classic fixture into the stack
        if: matrix.compat == 'true'
        env:
          STACK_CA_FILE: ${{ runner.temp }}/cert.pem
          STACK_MIGRATE: "true"
          STACK_WAIT: 5m
        run: go test -tags stack -count=1 -v -run TestMigrateClassicInstance ./test/stack/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-${{ matrix.name }}
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Show the stack's logs
        if: failure()
        run: docker compose logs --no-color --tail 300
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
