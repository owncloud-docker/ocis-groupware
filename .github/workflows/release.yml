name: Release

# scripts/release pushes a signed tag whose message holds the release notes.
# This workflow publishes the GitHub release (binaries, checksums, SBOMs) and
# the container image from it. Run it by hand with a tag name to publish a
# release for a tag that already exists.
on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish
        required: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Check that the tag is signed and read the release notes
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not a version like v1.2.3 or v1.2.3-rc.1."
            exit 1
          fi
          ref=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG")
          if [ "$(jq -r .object.type <<<"$ref")" != tag ]; then
            echo "::error::$TAG is a lightweight tag. Create it with scripts/release."
            exit 1
          fi
          tag=$(gh api "repos/$GH_REPO/git/tags/$(jq -r .object.sha <<<"$ref")")
          if [ "$(jq -r .verification.verified <<<"$tag")" != true ]; then
            echo "::error::The signature of $TAG is not verified."
            exit 1
          fi
          # The chart defaults the image tag to its appVersion, which has to
          # name this release (scripts/release checks the same).
          app=$(gh api "repos/$GH_REPO/contents/deploy/helm/ocis-groupware/Chart.yaml?ref=$TAG" --jq .content |
            base64 -d | sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p')
          if [ "$app" != "${TAG#v}" ]; then
            echo "::error::deploy/helm/ocis-groupware/Chart.yaml at $TAG has appVersion ${app:-(none)}, not ${TAG#v}."
            exit 1
          fi
          # Drop the first line (the version) and the blank line after it, and
          # any signature block the API adds to the message.
          jq -r .message <<<"$tag" | tail -n +3 | sed '/^-----BEGIN .* SIGNATURE-----$/,$d' >notes.md
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: notes.md
          if-no-files-found: error

  binaries:
    name: Binaries and GitHub release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.verify.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/package.json
          package-manager-cache: false
      # The binary embeds the web app, so it has to be built first.
      - name: Build the web app
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes notes.md
        env:
          GITHUB_TOKEN: ${{ github.token }}

  image:
    name: Container image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.verify.outputs.tag }}
          persist-credentials: false
      - name: Work out the image tags
        id: meta
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version=${TAG#v}
          tags="$image:$version"
          # A release candidate gets no moving tags.
          if [[ $version != *-* ]]; then
            minor=${version%.*}
            tags+=$'\n'"$image:$minor"$'\n'"$image:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >>"$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.verify.outputs.tag }}
            org.opencontainers.image.licenses=Apache-2.0
